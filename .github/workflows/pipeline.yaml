name: MERN Stack CI/CD Pipeline

on:
  push:
    branches: [ compose ]
  #pull_request:
  #  branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies for backend
        run: |
          cd mern/backend
          npm ci
          
      - name: Run backend tests
        run: |
          cd mern/backend
          npm test
          
      - name: Install dependencies for frontend
        run: |
          cd mern/frontend
          npm ci
          
      - name: Run frontend tests
        run: |
          cd mern/frontend
          npm test
          
  build_and_deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .mern/backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:buildcache,mode=max
          
      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .mern/frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:buildcache,mode=max
          
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /path/to/your/app
            
            # Pull the latest code
            git pull
            
            # Pull the latest images
            docker-compose pull
            
            # Restart containers with new images
            docker-compose down
            docker-compose up -d
            
            # Cleanup unused images
            docker image prune -f
