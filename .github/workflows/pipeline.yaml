# 


name: MERN Stack CI/CD Pipeline

on:
  push:
    branches: [ compose ] # Triggers on pushes to the 'compose' branch
  #pull_request:
  # branches: [ main, master ] # Uncomment and adjust if you want PRs to trigger
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Use v4 for latest compatibility

      # --- Backend Test Steps ---
      - name: Setup Node.js for Backend
        uses: actions/setup-node@v4 # Use v4 for latest compatibility
        with:
          node-version: '18' # Or your desired Node.js version
          cache: 'npm'
          # IMPORTANT: cache-dependency-path must point to the lock file relative to the repo root
          cache-dependency-path: mern/backend/package-lock.json 
          
      - name: Install dependencies for backend
        # Using 'working-directory' is cleaner than 'cd' inside 'run'
        run: npm ci 
        working-directory: ./mern/backend # Executes npm ci inside mern/backend
          
      - name: Run backend tests
        run: npm test
        working-directory: ./mern/backend # Executes npm test inside mern/backend

      # --- Frontend Test Steps ---
      # Need a separate setup-node for frontend to ensure correct caching path
      - name: Setup Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Or your desired Node.js version
          cache: 'npm'
          # IMPORTANT: cache-dependency-path must point to the lock file relative to the repo root
          cache-dependency-path: mern/frontend/package-lock.json 
          
      - name: Install dependencies for frontend
        run: npm ci
        working-directory: ./mern/frontend # Executes npm ci inside mern/frontend
          
      - name: Run frontend tests
        run: npm test
        working-directory: ./mern/frontend # Executes npm test inside mern/frontend
          
  build_and_deploy:
    needs: test # This job will only run if the 'test' job succeeds
    runs-on: ubuntu-latest
    # This condition ensures deployment only happens on push or manual trigger, not PRs
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Use v4 for latest compatibility

        # --- NEW STEP: TRANSFER FILES TO SERVER ---
      - name: Transfer project files to server
        uses: appleboy/scp-action@v0.1.6 # Use this action to copy files
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "." # This means copy everything from the root of your Git repository
          # IMPORTANT: This is the directory on your EC2 instance where your project files will go.
          # Make sure it exists, or create it manually via SSH first!
          target: "/home/ubuntu/docker-mern-stack-application/" # <--- CHOOSE A SPECIFIC, NEW PATH HERE! (e.g., /home/ubuntu/mern-app)
                                              # This path MUST match the 'cd' command in the next step.
      # --- END OF NEW STEP ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Use v3 for latest compatibility
        
      - name: Login to DockerHub
        uses: docker/login-action@v3 # Use v3 for latest compatibility
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5 # Use v5 for latest compatibility
        with:
          # CORRECTED: context must be the DIRECTORY containing the Dockerfile, not a file
          context: ./mern/backend/ 
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:buildcache,mode=max
          
      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5 # Use v5 for latest compatibility
        with:
          # CORRECTED: context must be the DIRECTORY containing the Dockerfile, not a file
          context: ./mern/frontend/ 
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:buildcache,mode=max
          
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0 # IMPORTANT: Use a specific version like v1.0.0, not 'master'!!
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # IMPORTANT: Replace '/path/to/your/app' with the actual directory on your EC2 instance
            # (e.g., /home/ubuntu/docker-mern-stack-application)
            cd /home/ubuntu/docker-mern-stack-application 
            
            # Pull the latest Docker images from Docker Hub
            docker compose pull
            
            # Restart containers with new images
            # 'docker-compose' is deprecated, use 'docker compose'
            docker compose down 
            docker compose up -d --force-recreate # --build is not needed here as images are pulled
            
            # Cleanup unused images (optional but good for space)
            docker image prune -f
            
            echo "Deployment successful!"